name: teccontrol

services:
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-teccontrol}
      DB_USER: ${DB_USER:-teccontrol}
      DB_PASSWORD: ${DB_PASSWORD:?Completa DB_PASSWORD en .env}
      TEC_HTTPS_PORT: ${HTTPS_PORT:-8443}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      SESSION_MAX_SECONDS: ${SESSION_MAX_SECONDS:-28800}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
      - "127.0.0.1:${HTTPS_PORT:-8443}:443"
    volumes:
      - tls_local:/var/lib/teccontrol/tls
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@stream_socket_client('tcp://127.0.0.1:443') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-teccontrol}
      MYSQL_USER: ${DB_USER:-teccontrol}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Completa DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Completa DB_ROOT_PASSWORD en .env}
      MYSQL_ROOT_HOST: localhost
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_esquema_provisional.sql:/docker-entrypoint-initdb.d/10-esquema.sql:ro
      - ./database/02_datos_prueba.sql:/opt/teccontrol/datos-prueba.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --execute='SELECT 1 FROM estados_orden LIMIT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
  tls_local:
