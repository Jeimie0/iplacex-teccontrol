ServerName localhost

<VirtualHost *:80>
    Redirect 308 / https://localhost:${TEC_HTTPS_PORT}/
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/teccontrol/public
    DirectoryIndex index.php

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /var/lib/teccontrol/tls/localhost.crt
    SSLCertificateKeyFile /var/lib/teccontrol/tls/localhost.key

    <Directory /var/www/teccontrol/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
</VirtualHost>
