ServerName ${TEC_DOMAIN}
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme/.well-known/acme-challenge>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    RedirectMatch 308 "^/(?!\.well-known/acme-challenge/)(.*)$" "${TEC_ORIGEN_HTTPS}/$1"
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/teccontrol/public
    DirectoryIndex index.php

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /var/lib/teccontrol/hosting-tls/fullchain.pem
    SSLCertificateKeyFile /var/lib/teccontrol/hosting-tls/privkey.pem

    <Directory /var/www/teccontrol/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
</VirtualHost>
